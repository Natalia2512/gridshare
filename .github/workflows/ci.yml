# Runs on every push and pull request: unit + contract tests, then a full
# 24-step simulation of all scenarios. A red cross = do not merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit, contract and end-to-end tests
        run: pytest -q
      - name: Full simulation, all scenarios (real modules where present, stubs otherwise)
        run: python run_demo.py --scenario all --quiet --out results
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: results/
          if-no-files-found: ignore